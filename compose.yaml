services:
  api:
    build: .
    env_file: .env
    environment:
      # Docker Desktop: el host es el MongoDB existente, no un servicio nuevo.
      # En Linux configure DOCKER_MONGODB_URI con un destino privado accesible.
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://host.docker.internal:27017/registro_visitas?directConnection=true}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3015
    ports:
      - "127.0.0.1:3015:3015"
